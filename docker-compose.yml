services:
  # Nginx Reverse Proxy and Round-Robin Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nipunhire-nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nipunhire-network

  # FastAPI Backend Service (Scalable Replicas)
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: nipunhire-backend:latest
    environment:
      - ENVIRONMENT=production
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=nipunhire_db
      - JWT_SECRET=dev_secret_change_this_in_production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - mongodb
    networks:
      - nipunhire-network

  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: nipunhire-mongodb
    restart: always
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nipunhire-network

  # Elasticsearch Full-Text & BM25 Relevance Search Service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: nipunhire-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    expose:
      - "9200"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nipunhire-network

networks:
  nipunhire-network:
    driver: bridge

volumes:
  mongodb_data:
  elasticsearch_data:
